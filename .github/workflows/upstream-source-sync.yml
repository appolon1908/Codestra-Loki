name: Codestra Upstream Source Sync

on:
  push:
    branches: [main]
    paths:
      - CODESTRA_UPSTREAM.json
      - .github/workflows/upstream-source-sync.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: codestra-upstream-source-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out Codestra authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Import exact official upstream source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mapfile -t values < <(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('CODESTRA_UPSTREAM.json').read_text())
          print(data['upstream_clone_url'])
          print(data['upstream_ref'])
          print(data['import_path'])
          PY
          )
          UPSTREAM_URL="${values[0]}"
          UPSTREAM_REF="${values[1]}"
          IMPORT_PATH="${values[2]}"
          [[ "$UPSTREAM_URL" == 'https://github.com/grafana/loki.git' ]]
          [[ "$UPSTREAM_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMPORT_PATH" == upstream ]]

          rm -rf .codestra-upstream-src "$IMPORT_PATH"
          git init --quiet .codestra-upstream-src
          git -C .codestra-upstream-src remote add origin "$UPSTREAM_URL"
          GIT_LFS_SKIP_SMUDGE=1 git -C .codestra-upstream-src fetch --depth 1 --no-tags origin "$UPSTREAM_REF"
          git -C .codestra-upstream-src checkout --quiet --detach FETCH_HEAD
          UPSTREAM_SHA="$(git -C .codestra-upstream-src rev-parse HEAD)"
          [[ "$UPSTREAM_SHA" == "$UPSTREAM_REF" ]]
          EXPECTED_UPSTREAM_TREE="$(git -C .codestra-upstream-src rev-parse 'HEAD^{tree}')"
          UPSTREAM_TIMESTAMP="$(git -C .codestra-upstream-src show -s --format=%cI "$UPSTREAM_SHA")"
          rm -rf .codestra-upstream-src/.git
          mv .codestra-upstream-src "$IMPORT_PATH"

          export UPSTREAM_URL UPSTREAM_REF UPSTREAM_SHA UPSTREAM_TIMESTAMP
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('CODESTRA_UPSTREAM_LOCK.json').write_text(json.dumps({
              'schema_version': '1.0',
              'upstream_clone_url': os.environ['UPSTREAM_URL'],
              'upstream_ref': os.environ['UPSTREAM_REF'],
              'upstream_commit': os.environ['UPSTREAM_SHA'],
              'import_path': 'upstream',
              'synchronized_at': os.environ['UPSTREAM_TIMESTAMP'],
              'deployment_enabled': False,
          }, indent=2) + '\n')
          PY

          SYNC_BRANCH="sync/loki-upstream-${UPSTREAM_SHA}"
          EXPECTED_LOCK_BLOB="$(git hash-object CODESTRA_UPSTREAM_LOCK.json)"
          REMOTE_SHA="$(git ls-remote --heads origin "refs/heads/${SYNC_BRANCH}" | awk '{print $1}')"
          mapfile -t OPEN_PRS < <(
            gh pr list --repo "$GITHUB_REPOSITORY" --state open \
              --base main --head "$SYNC_BRANCH" --json number --jq '.[].number'
          )
          if (( ${#OPEN_PRS[@]} > 1 )); then
            echo 'Multiple open synchronization pull requests found.' >&2
            exit 3
          fi

          if [[ -n "$REMOTE_SHA" ]]; then
            git fetch --no-tags origin \
              "refs/heads/${SYNC_BRANCH}:refs/remotes/origin/${SYNC_BRANCH}"
            [[ "$(git cat-file -t "$REMOTE_SHA")" == commit ]]
            mapfile -t REMOTE_COMMIT_WORDS < <(git rev-list --parents -n 1 "$REMOTE_SHA")
            read -r -a REMOTE_COMMIT_WORDS <<< "${REMOTE_COMMIT_WORDS[0]}"
            (( ${#REMOTE_COMMIT_WORDS[@]} == 2 )) || {
              echo 'Existing sync branch is not a single-parent reviewed commit.' >&2
              exit 3
            }
            REMOTE_PARENT="${REMOTE_COMMIT_WORDS[1]}"
            git merge-base --is-ancestor "$REMOTE_PARENT" "$GITHUB_SHA" || {
              echo 'Existing sync branch parent is not protected-main history.' >&2
              exit 3
            }
            REMOTE_UPSTREAM_TREE="$(git rev-parse "${REMOTE_SHA}:upstream")"
            REMOTE_LOCK_BLOB="$(git rev-parse "${REMOTE_SHA}:CODESTRA_UPSTREAM_LOCK.json")"
            [[ "$REMOTE_UPSTREAM_TREE" == "$EXPECTED_UPSTREAM_TREE" ]]
            [[ "$REMOTE_LOCK_BLOB" == "$EXPECTED_LOCK_BLOB" ]]
            mapfile -t REMOTE_CONTROL_CHANGES < <(
              git diff --name-only "$REMOTE_PARENT" "$REMOTE_SHA" -- . ':(exclude)upstream'
            )
            (( ${#REMOTE_CONTROL_CHANGES[@]} == 1 )) && \
              [[ "${REMOTE_CONTROL_CHANGES[0]}" == CODESTRA_UPSTREAM_LOCK.json ]] || {
              echo 'Existing sync branch contains an unexpected control-plane change.' >&2
              exit 3
            }

            if (( ${#OPEN_PRS[@]} == 0 )); then
              gh pr create \
                --repo "$GITHUB_REPOSITORY" \
                --base main \
                --head "$SYNC_BRANCH" \
                --title "vendor(loki): Sync reviewed official upstream ${UPSTREAM_SHA}" \
                --body "Pins and imports exact official Loki commit ${UPSTREAM_SHA}. Deployment remains disabled. Normal source validation and independent review are required."
            fi
            gh workflow run validate.yml --repo "$GITHUB_REPOSITORY" --ref "$SYNC_BRANCH"
            exit 0
          fi

          (( ${#OPEN_PRS[@]} == 0 )) || {
            echo 'Open synchronization pull request has no matching remote branch.' >&2
            exit 3
          }
          git config user.name 'codestra-upstream-sync'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          export GIT_AUTHOR_DATE="$UPSTREAM_TIMESTAMP"
          export GIT_COMMITTER_DATE="$UPSTREAM_TIMESTAMP"
          git switch --create "$SYNC_BRANCH"
          git fetch --depth 1 --no-tags "$UPSTREAM_URL" "$UPSTREAM_SHA"
          git rm -r --cached --quiet --ignore-unmatch upstream
          git read-tree --prefix=upstream/ "${UPSTREAM_SHA}^{tree}"
          git add CODESTRA_UPSTREAM_LOCK.json
          if git diff --cached --quiet; then
            echo 'Exact upstream snapshot already current.'
            exit 0
          fi
          git commit -m "vendor(loki): Sync official upstream ${UPSTREAM_SHA}"
          git push origin "HEAD:refs/heads/${SYNC_BRANCH}"

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$SYNC_BRANCH" \
            --title "vendor(loki): Sync reviewed official upstream ${UPSTREAM_SHA}" \
            --body "Pins and imports exact official Loki commit ${UPSTREAM_SHA}. Deployment remains disabled. Normal source validation and independent review are required."
          gh workflow run validate.yml --repo "$GITHUB_REPOSITORY" --ref "$SYNC_BRANCH"
